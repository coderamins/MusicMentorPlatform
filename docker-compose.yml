version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: musicmentor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: musicmentor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - musicmentor_pgdata:/var/lib/postgresql/data

volumes:
  musicmentor_pgdata:
